name: Publish verified I.C.E. major preview
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'scripts/browser-smoke.mjs'
      - 'studio/acceptance/major-*.mjs'
      - '.github/workflows/playtest-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flame-playtest-pages
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'BoRHeX/flame-game-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit, invariant and production acceptance tests
        run: npm test
      - name: Verify complete major-world integration
        run: node studio/acceptance/major-integration.mjs
      - name: Test actual touch controls, mission and flame in mobile Chrome
        run: npm run browser:smoke
      - name: Preserve both mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ice-major-preview-evidence
          path: |
            artifacts/mobile-world.png
            artifacts/mobile-flame.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./game
  deploy:
    needs: verify
    if: github.repository == 'BoRHeX/flame-game-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ice-playtest
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
