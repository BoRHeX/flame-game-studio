name: Publish isolated I.C.E. playtest preview
on:
  push:
    branches: [feature/foundation-01]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flame-playtest-pages
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository == 'BoRHeX/flame-game-studio'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./game
      - id: deployment
        uses: actions/deploy-pages@v4
