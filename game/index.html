<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c131c"><link rel="stylesheet" href="./style.css"><title>I.C.E. / The Flame Game — early mobile slice</title></head>
<body>
<main id="game" aria-label="I.C.E. flame game">
  <header id="hud">
    <span aria-label="Funds">◈ <output id="cash">110.0</output></span>
    <span aria-label="Mission clock">◷ <output id="mission-clock">0</output></span>
    <span aria-label="Burner temperature">♨ <output id="temperature">0.12</output></span>
    <span id="result" aria-label="Hub">⌂</span>
  </header>
  <div id="viewport">
    <canvas id="world" width="640" height="360" aria-label="Industrial workshop and player; tap to walk or use equipment"></canvas>
    <canvas id="flame" width="640" height="360" aria-label="Close observation of combustion chamber"></canvas>
    <div id="tutorial" aria-label="Icon-only tutorial">
      <div>☞　◆　→　ϟ　→　◎</div>
      <button id="tutorial-ok" aria-label="Dismiss tutorial">✓</button>
    </div>
  </div>
  <nav id="jobs" aria-label="Select a contract">
    <button type="button" data-job="backyard" aria-label="Backyard light-off mission">✦</button>
    <button type="button" data-job="warehouse" aria-label="Warehouse restart mission">▤</button>
    <button type="button" data-job="heat-hold" aria-label="Heat hold mission">◉</button>
  </nav>
  <div id="progress" role="progressbar" aria-label="Objective hold progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
  <div id="device-panel" hidden>
    <span id="device-symbol" aria-hidden="true">◆</span>
    <input id="device-slider" type="range" min="0" max="100" value="44" aria-label="Manual device position">
    <button id="device-close" aria-label="Finish adjusting">✓</button>
  </div>
  <div id="actions">
    <button id="spark" aria-label="Spark pilot ignition">ϟ</button>
    <button id="observe" aria-label="Enter or leave flame observation" aria-pressed="false">◎</button>
    <button id="return" aria-label="Return to backyard hub">⌂</button>
    <button id="reset" aria-label="Restart demonstration">↺</button>
  </div>
</main>
<script type="module" src="./main.mjs"></script>
</body></html>
