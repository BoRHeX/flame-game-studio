<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c131c"><meta name="ice-build" content="20261111-major-pass-one-01"><meta name="ice-pass-two" content="operator-save-missions-01"><link rel="stylesheet" href="./style.css"><title>I.C.E. — Major development preview</title></head>
<body><main id="game" aria-label="I.C.E. flame game">
<header id="hud"><span aria-label="Funds">◈ <output id="cash">110.0</output></span><span id="result" aria-label="Backyard hub">⌂</span><span hidden><output id="mission-clock">0</output><output id="temperature">0.12</output></span><div id="progress" role="progressbar" aria-label="Objective hold progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div><button id="save-menu" type="button" aria-label="Open three save slots" title="Save and load slots">▣</button><button id="controls-mode" type="button" aria-label="Use directional buttons" aria-pressed="false" title="Change movement controls">☷</button><button id="handedness" type="button" aria-label="Move controls to right thumb" title="Swap thumb sides">⇄</button><button id="fullscreen" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen">⛶</button><output id="control-status" class="sr-only" role="status" aria-live="polite"></output></header>
<div id="viewport">
<canvas id="world" width="768" height="1152" aria-label="Industrial workshop and player"></canvas><output id="mission-cue" hidden role="status" aria-label="Process warning"></output>
<div id="inspection" hidden><canvas id="flame" width="640" height="360" aria-label="Close observation of combustion chamber"></canvas></div>
<div id="tutorial" aria-label="Icon-only tutorial"><div>☞　◆　→　ϟ　→　◎</div><button id="tutorial-ok" aria-label="Dismiss tutorial">✓</button></div>
<nav id="jobs" aria-label="Select a contract"><button type="button" data-job="backyard" aria-label="Backyard light-off mission">✦</button><button type="button" data-job="warehouse" aria-label="Warehouse restart mission">▤</button><button type="button" data-job="heat-hold" aria-label="Heat hold mission">◉</button></nav>
<div id="device-panel" hidden><span id="device-symbol" aria-hidden="true">◆</span><input id="device-slider" type="range" min="0" max="100" value="44" aria-label="Manual device position"><button id="device-repair" aria-label="Repair sticky damper for five credits" title="Repair sticky damper">⚒</button><button id="device-close" aria-label="Finish adjusting">✓</button></div>
<div id="operator-panel" hidden role="dialog" aria-label="Industrial operator">
 <div class="panel-heading">☻　⚒</div><div class="panel-actions">
 <button id="operator-guide" aria-label="Ask operator for diagnosis" title="Get a machine diagnosis">◇ ?</button>
 <button id="operator-assist" aria-label="Ask operator to adjust nearby equipment" title="Local valve assistance">⚒ ↻</button>
 <button id="operator-close" aria-label="Close operator panel">✕</button></div>
</div>
<div id="save-panel" hidden role="dialog" aria-label="Three save slots">
 <div class="panel-heading">▣　I.C.E.</div>
 <div class="slot-row" id="slot-1"><b>01</b><output>◇</output><button data-save-slot="1" aria-label="Save to slot one">▣</button><button data-load-slot="1" aria-label="Load slot one">↶</button></div>
 <div class="slot-row" id="slot-2"><b>02</b><output>◇</output><button data-save-slot="2" aria-label="Save to slot two">▣</button><button data-load-slot="2" aria-label="Load slot two">↶</button></div>
 <div class="slot-row" id="slot-3"><b>03</b><output>◇</output><button data-save-slot="3" aria-label="Save to slot three">▣</button><button data-load-slot="3" aria-label="Load slot three">↶</button></div>
 <button id="save-close" aria-label="Close save slots">✕</button>
</div>
<div id="hint" hidden aria-hidden="true"></div>
<div id="actions"><button id="spark" aria-label="Spark pilot ignition">ϟ</button><button id="observe" aria-label="Enter or leave flame observation" aria-pressed="false">◎</button><button id="return" aria-label="Return to backyard hub">⌂</button><button id="reset" aria-label="Restart demonstration">↺</button></div>
</div>
<div id="controls" aria-label="Thumb controls" data-mode="joystick" data-hand="left">
  <div id="motion-controls">
    <div id="joystick" role="application" aria-label="Analog movement joystick" title="Drag to walk or climb"><div id="joystick-knob" aria-hidden="true"></div></div>
    <div id="digital-pad" aria-label="Directional movement buttons" hidden>
      <button class="pad-up" data-hold="up" aria-label="Climb up">▲</button>
      <button class="pad-left" data-hold="left" aria-label="Move left">◀</button>
      <button class="pad-down" data-hold="down" aria-label="Climb down">▼</button>
      <button class="pad-right" data-hold="right" aria-label="Move right">▶</button>
    </div>
  </div>
  <div id="action-controls"><button data-hold="jump" aria-label="Jump">⤒</button><button id="interact" aria-label="Interact">✋</button></div>
</div>
</main><script type="module" src="./main.mjs"></script></body></html>
