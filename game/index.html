<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c131c"><meta name="ice-build" content="20261111-major-pass-one-01"><link rel="stylesheet" href="./style.css"><title>I.C.E. — Major development preview</title></head>
<body><main id="game" aria-label="I.C.E. flame game">
<header id="hud"><span aria-label="Funds">◈ <output id="cash">110.0</output></span><span id="result" aria-label="Backyard hub">⌂</span><span hidden><output id="mission-clock">0</output><output id="temperature">0.12</output></span><div id="progress" role="progressbar" aria-label="Objective hold progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div></header>
<div id="viewport">
<canvas id="world" width="768" height="1152" aria-label="Industrial workshop and player"></canvas>
<div id="inspection" hidden><canvas id="flame" width="640" height="360" aria-label="Close observation of combustion chamber"></canvas></div>
<div id="tutorial" aria-label="Icon-only tutorial"><div>☞　◆　→　ϟ　→　◎</div><button id="tutorial-ok" aria-label="Dismiss tutorial">✓</button></div>
<nav id="jobs" aria-label="Select a contract"><button type="button" data-job="backyard" aria-label="Backyard light-off mission">✦</button><button type="button" data-job="warehouse" aria-label="Warehouse restart mission">▤</button><button type="button" data-job="heat-hold" aria-label="Heat hold mission">◉</button></nav>
<div id="device-panel" hidden><span id="device-symbol" aria-hidden="true">◆</span><input id="device-slider" type="range" min="0" max="100" value="44" aria-label="Manual device position"><button id="device-close" aria-label="Finish adjusting">✓</button></div>
<div id="hint" hidden aria-hidden="true"></div>
<div id="actions"><button id="spark" aria-label="Spark pilot ignition">ϟ</button><button id="observe" aria-label="Enter or leave flame observation" aria-pressed="false">◎</button><button id="return" aria-label="Return to backyard hub">⌂</button><button id="reset" aria-label="Restart demonstration">↺</button></div>
</div>
<div id="controls" aria-label="Movement controls"><button data-hold="left" aria-label="Move left">◀</button><button data-hold="right" aria-label="Move right">▶</button><button data-hold="up" aria-label="Climb up">▲</button><button data-hold="down" aria-label="Climb down">▼</button><button data-hold="jump" aria-label="Jump">⤒</button><button id="interact" aria-label="Interact">✋</button></div>
</main><script type="module" src="./main.mjs"></script></body></html>
